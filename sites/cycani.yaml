# sites/cycani.yaml  —  Tier-2 自定义 JSON 模板
key: cycani
name: 次元城
base_url: https://www.cycani.org
adapter: json_custom
enabled: false

compliance:
  policy: block_adult
  bc_filter: true
  notes: "次元城为动漫站点，采集前请自行确认内容合规性。"

request:
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    X-App-Name: "cyc_web"
    X-App-Version: "cycweb"
    X-Time-Zone: "Asia/Shanghai"
    Referer: "{base_url}/"
    Accept-Language: "zh-CN,zh;q=0.9"
  rate_limit: 1.0
  timeout: 15
  retries: 3

# ── T2 核心：字段映射词典 ──────────────────────────────────────────
mapping:
  # 搜索接口：关键词 -> 视频列表
  search:
    url: "/api/videos/search"
    method: GET
    params:
      q: "{keyword}"
      page: "{page}"
      page_size: 50
    # 响应根节点下的列表路径
    list_path: "$.data.list[*]"
    fields:
      id: "$.video_id"
      title: "$.title"
      cover: "$.cover"           # 封面字段，如接口无此字段可删除
      description: "$.description"  # 简介字段，如接口无此字段可删除

  # 章节列表：根据视频 ID 拉取分集
  sections:
    url: "/api/videos/{id}/sections"
    method: GET
    params:
      player_code: "cychub"
      page: 1
      page_size: 100
    list_path: "$.data.list[*]"
    fields:
      episode_title: "$.title"
      episode_number: "$.episode_number"   # 用于拼播放页，如无此字段可改用 index
      # 如果接口直接返回 m3u8/播放地址，填下面的字段；否则留空，由网关/客户端处理
      play_url: "$.play_url"

  # 播放页模板（当 play_url 不存在时，用此模板拼接）
  play_page:
    url_template: "/anime/{source}/play/{episode_number}?from=cychub"
    # {source} 在 search 结果中通常与 id 同值，如不同请从 search.fields 中额外映射 source

# ── 探测标记（probe 会自动回写，手工可先留空）──────────────────────
detect: {}

tvbox:
  playerType: 2
