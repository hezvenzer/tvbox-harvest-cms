key: cycani
name: 次元城
base_url: https://www.cycani.org
adapter: json_custom
enabled: true

compliance:
  policy: block_adult
  bc_filter: true
  notes: "次元城为动漫站点，采集前请自行确认内容合规性。"

request:
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    X-App-Name: "cyc_web"
    X-App-Version: "cycweb"
    X-Time-Zone: "Asia/Shanghai"
    Referer: "{base_url}/"
    Accept-Language: "zh-CN,zh;q=0.9"
  rate_limit: 1.0
  timeout: 15
  retries: 3

# ── json_custom 适配器识别的扁平字段块 ──────────────────────────
fields:
  # 列表接口的完整 URL 模板，必须包含 {base_url} 和 {keyword}
  list_url: "{base_url}/api/videos/search?q={keyword}&page={page}&page_size=50"
  # 列表在响应中的 JSONPath
  list_path: "$.data.list[*]"
  # 视频 ID 的 JSONPath（适配器内部键名就叫 id，不能改叫 video_id）
  id: "$.video_id"
  # 视频标题的 JSONPath（适配器内部键名就叫 name，不能改叫 title）
  name: "$.title"

  # 章节列表的 JSONPath（cycani 的章节接口与搜索接口共用此路径）
  episodes_path: "$.data.list[*]"
  # 分集标题的 JSONPath
  episode_name: "$.title"
  # episode_url 刻意留空：cycani 的播放直链需要 Authorization 头，
  # T2 采集平面无法获得登录态，因此不配置该字段。
  # 即使配置了，适配器也会因为取不到有效媒体地址而无法生成线路。

# ── 探测标记，保持默认即可 ────────────────────────────────────────
detect:
  version: 1
  stale: false
  evidence: {}

tvbox:
  playerType: 2
